validation:
  required_columns:
    - "record_id"
    - "name"
    - "rating"
    - "category"
    - "status"
  numeric_columns:
    - "rating"
    - "record_id"

processing:
  remove_duplicates: true

  missing:
    enabled: true
    axis: "rows"

  outliers:
    enabled: true
    columns:
      - rating
    method: "iqr"
    threshold: 1.5